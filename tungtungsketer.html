<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slot Ridho</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#2a0a1f; --panel:#4a1233; --gold:#ffc83d; --gold2:#e8920c; --cream:#fff3d6; --red:#ff4d5e; --green:#4be38a; --reel:#fffaf0; --ink:#2a0a1f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{display:flex;justify-content:center;padding:16px;background:radial-gradient(ellipse at top,#5a1740 0,var(--bg) 65%) fixed}
.app{width:100%;max-width:420px;text-align:center}
h1{font-family:Georgia,"Times New Roman",serif;font-size:2.4rem;margin:8px 0 2px;color:var(--gold);letter-spacing:.04em;text-shadow:0 3px 0 var(--gold2),0 6px 14px rgba(0,0,0,.5)}
.sub{margin:0 0 14px;opacity:.8;font-size:.95rem}
.tung{display:inline-block;margin:0 0 14px;padding:6px 16px;background:var(--red);color:#fff;border-radius:10px;font-weight:900;font-size:1.2rem;letter-spacing:.06em;transform:rotate(-3deg);box-shadow:0 4px 0 #a02030}
.coins{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--gold);border-radius:999px;padding:8px 18px;font-weight:700;font-size:1.15rem}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,var(--gold) 55%,var(--gold2));border:2px solid var(--gold2);display:inline-block}
.machine{margin:18px 0 14px;padding:18px 14px;background:linear-gradient(#6a1b48,var(--panel));border:4px solid var(--gold);border-radius:22px;box-shadow:0 0 0 4px var(--gold2),0 18px 40px rgba(0,0,0,.55)}
.reels{display:flex;gap:10px;justify-content:center;background:#16050f;padding:10px;border-radius:14px}
.reel{flex:1;height:110px;background:var(--reel);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:4rem;font-weight:900;color:var(--red);font-family:Georgia,serif;box-shadow:inset 0 6px 12px rgba(0,0,0,.3),inset 0 -6px 12px rgba(0,0,0,.2);overflow:hidden}
.reel.spin{animation:blur .12s linear infinite;filter:blur(1.5px)}
@keyframes blur{0%{transform:translateY(-14px)}50%{transform:translateY(14px)}100%{transform:translateY(-14px)}}
.reel.stop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.win .reel{background:#fff3b0;box-shadow:0 0 18px var(--gold),inset 0 0 12px var(--gold2)}
.msg{min-height:3.2em;margin:14px 0 4px;font-size:1.15rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.msg.lose{color:var(--cream)}
.msg.pay{color:var(--red);animation:shake .4s}
.msg.won{color:var(--green);font-size:1.5rem}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
button{font:inherit;cursor:pointer}
.spin-btn{width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(var(--gold),var(--gold2));color:var(--ink);font-size:1.5rem;font-weight:900;letter-spacing:.08em;box-shadow:0 6px 0 #9a5a05,0 12px 20px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s}
.spin-btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #9a5a05}
.spin-btn:disabled{opacity:.6;cursor:not-allowed}
.spin-btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.info{margin-top:16px;font-size:.85rem;opacity:.7;line-height:1.5}
.stats{margin-top:10px;font-size:.9rem;opacity:.85}
@media (prefers-reduced-motion:reduce){.reel.spin,.reel.stop,.msg.pay{animation:none}}
</style>
</head>
<body>
<main class="app">
  <h1>Slot Ridho</h1>
  <p class="sub">Putar dan semoga 7 7 7</p>
  <div class="tung">tung tung sketer</div>
  <div class="coins"><span class="coin"></span><span>Koin: <span id="coins">0</span></span></div>

  <div class="machine" id="machine">
    <div class="reels">
      <div class="reel" id="r0">7</div>
      <div class="reel" id="r1">7</div>
      <div class="reel" id="r2">7</div>
    </div>
  </div>

  <div class="msg" id="msg" aria-live="polite">Tekan SPIN untuk mulai</div>
  <button class="spin-btn" id="spinBtn">SPIN</button>
  <div class="stats" id="stats">Spin: 0 · Menang: 0</div>
  <p class="info">Koin ini cuma mainan, bukan uang asli. Peluang menang 10% per spin.</p>
</main>

<script>
(function(){
  var coins = 0, spins = 0, wins = 0, busy = false;
  var symbols = ["🍒","🍋","🔔","⭐","💎","7"];
  var reels = [0,1,2].map(function(i){return document.getElementById("r"+i)});
  var msg = document.getElementById("msg");
  var btn = document.getElementById("spinBtn");
  var machine = document.getElementById("machine");
  var coinsEl = document.getElementById("coins");
  var statsEl = document.getElementById("stats");

  function rnd(n){return Math.floor(Math.random()*n)}
  function setMsg(text, cls){
    msg.className = "msg " + (cls||"");
    void msg.offsetWidth;
    msg.textContent = text;
  }

  // Hasil akhir: menang 10% => 7 7 7. Kalau kalah, pastikan bukan 7 7 7.
  function result(){
    if(Math.random() < 0.10) return ["7","7","7"];
    var r;
    do { r = [symbols[rnd(6)], symbols[rnd(6)], symbols[rnd(6)]]; }
    while(r[0]==="7" && r[1]==="7" && r[2]==="7");
    return r;
  }

  function spin(){
    if(busy) return;
    // Koin selalu nol, jadi harus bayar dulu
    if(coins <= 0){
      setMsg("Harus bayar Ridho dulu 💸", "pay");
      return;
    }
    busy = true; btn.disabled = true;
    machine.classList.remove("win");
    setMsg("Memutar...", "lose");
    var res = result();
    spins++;
    reels.forEach(function(el){ el.classList.remove("stop"); el.classList.add("spin"); });
    var ticker = setInterval(function(){
      reels.forEach(function(el){ if(el.classList.contains("spin")) el.textContent = symbols[rnd(6)]; });
    }, 80);
    reels.forEach(function(el,i){
      setTimeout(function(){
        el.classList.remove("spin");
        el.textContent = res[i];
        el.classList.add("stop");
        if(i===2){
          clearInterval(ticker);
          finish(res);
        }
      }, 900 + i*500);
    });
  }

  function finish(res){
    var win = res[0]==="7" && res[1]==="7" && res[2]==="7";
    if(win){
      wins++;
      machine.classList.add("win");
      setMsg("JACKPOT 7 7 7! Kamu menang 🎉", "won");
    } else {
      setMsg("Belum beruntung, coba lagi", "lose");
    }
    statsEl.textContent = "Spin: " + spins + " · Menang: " + wins;
    busy = false; btn.disabled = false;
  }

  btn.addEventListener("click", spin);
})();
</script>
</body>
</html>
